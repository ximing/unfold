[package]
name = "unfold"
version = "0.1.0"
description = "Unfold desktop"
authors = ["Unfold"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "unfold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
