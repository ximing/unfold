name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple 芯片
            platform: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-15-intel
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            rust-targets: ''
            args: ''
          - name: Windows
            platform: windows-latest
            rust-targets: ''
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 libssl-dev rpm file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install desktop CLI
        run: pnpm install --frozen-lockfile --filter @unfold/desktop...

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          includeUpdaterJson: false
          tagName: ${{ github.event_name == 'workflow_dispatch' && 'desktop-v__VERSION__' || github.ref_name }}
          releaseName: Unfold 桌面版 v__VERSION__
          releaseDraft: false
          prerelease: false
          releaseBody: |
            安装包打开 https://unfold.aimo.plus，里面没有页面。站点更新不用重装。

            - macOS Apple 芯片（M 系列）：文件名带 aarch64 的 dmg
            - macOS Intel：文件名带 x64 的 dmg
            - Windows：文件名带 x64 的 exe 或 msi
            - Linux x64：deb、AppImage 或 rpm

            macOS 没有 Apple 公证。若系统提示已损坏或无法验证开发者，在应用程序上执行 `xattr -cr` 后再打开。
