<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unfold 原型 · 焦点扇形</title>
<style>
  :root {
    --desk: #e4e9ef;
    --sheet: #f6f7f9;
    --ink: #1a2230;
    --mute: #5c6675;
    --line: #c9d1db;
    --cobalt: #1d4e8f;
    --decision: #b8432f;
    --code: #1a2230;
    --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Palatino, serif;
    --mono: "SF Mono", Menlo, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--sheet);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  header {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 400px;
    align-items: center;
    gap: 16px;
    height: 52px;
    padding: 0 12px 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; gap: 14px; align-items: baseline; }
  .brand button, .textish { background: transparent; border: 0; padding: 4px 0; }
  #brand { font-weight: 600; }
  #go-today[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--cobalt); }
  #crumb { margin: 0; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head-right { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .search { position: relative; }
  .search input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 6px 0; }
  .hits {
    position: absolute; z-index: 6; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--sheet); border: 1px solid var(--line); padding: 4px 0;
    max-height: 60vh; overflow: auto;
  }
  .hits .group { padding: 6px 12px 2px; color: var(--mute); font-size: 12px; }
  .hits button { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 8px 12px; }
  .hits button:hover { background: var(--desk); }
  .hits small { display: block; color: var(--mute); }

  .app { height: calc(100% - 52px); display: grid; grid-template-columns: 230px minmax(0, 1fr) 350px; }
  nav, main, aside { min-height: 0; overflow: auto; }
  nav { background: var(--desk); padding: 18px 14px 40px; }
  main { padding: 18px 28px 64px; }
  aside { border-left: 1px solid var(--line); padding: 16px 16px 40px; }

  .dom { margin: 18px 0 4px; font-weight: 600; }
  .dom:first-child { margin-top: 0; }
  nav button.item {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 0; border-left: 2px solid transparent;
    padding: 5px 8px 5px 10px; color: var(--ink);
  }
  nav button.item.minor { color: var(--mute); }
  nav button.item[aria-current="true"] { border-left-color: var(--cobalt); font-family: var(--serif); font-size: 16px; }
  nav .sub { padding-left: 12px; }
  nav .mark { float: right; color: var(--mute); font-size: 12px; }

  .views { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 0 14px; }
  .views button { background: transparent; border: 0; padding: 4px 8px; color: var(--mute); }
  .views button[aria-selected="true"], .views button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--cobalt); }
  .views button:disabled { color: var(--line); cursor: not-allowed; box-shadow: none; }

  .toast { margin: 0 0 14px; padding: 10px 14px; border-left: 2px solid var(--cobalt); background: var(--desk); max-width: 68ch; }
  .due { margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .fail { color: var(--decision); }
  .muted { color: var(--mute); }

  .corebox { border-left: 2px solid var(--ink); padding: 4px 0 4px 14px; margin: 10px 0 18px; max-width: 62ch; }
  .corebox p { margin: 0 0 4px; font-family: var(--serif); font-size: 19px; line-height: 1.6; }
  .hero { font-family: var(--serif); font-weight: 600; line-height: 1.35; margin: 0 0 12px; font-size: 32px; max-width: 14em; }

  .prose { font-family: var(--serif); font-size: 17px; line-height: 1.75; max-width: 66ch; }
  .prose p { margin: 0 0 14px; }
  .blk { position: relative; margin: 0 0 14px; max-width: 66ch; }
  .blk .bt {
    position: absolute; left: -4px; top: 2px; transform: translateX(-100%);
    font-family: var(--sans); font-size: 11px; color: var(--mute);
    writing-mode: horizontal-tb; white-space: nowrap; display: none;
  }
  .blk:hover .bt, .blk.tagged .bt { display: block; }
  .blk.tagged .bt { position: static; transform: none; display: inline-block; margin-bottom: 4px; }
  .blk.mine { font-family: var(--serif); font-weight: 600; }
  .blk.question, .blk.note-block {
    font-family: var(--sans); font-size: 14px; border-top: 1px solid var(--line); padding: 10px 0;
  }
  .blk.hints { border-top: 1px solid var(--line); padding: 10px 0; font-family: var(--sans); font-size: 14px; }
  .blk.formula {
    font-family: var(--mono); font-size: 15px; text-align: center;
    padding: 14px; background: #eef1f5; margin: 0 0 14px;
  }
  .blk.theorem { border: 1px solid var(--line); border-left: 3px solid var(--cobalt); padding: 10px 14px; margin: 0 0 14px; }
  .blk.theorem h4 { margin: 0 0 6px; font-size: 14px; }
  .steps { list-style: none; margin: 0 0 14px; padding: 0; counter-reset: step; }
  .steps li { padding: 9px 0; border-top: 1px solid var(--line); font-family: var(--sans); font-size: 14.5px; }
  .steps strong { display: block; font-family: var(--serif); font-size: 17px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-family: var(--sans); font-size: 14px; line-height: 1.45; margin: 4px 0 16px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 12px 8px 0; }
  th { color: var(--cobalt); font-weight: 600; border-bottom: 1px solid var(--ink); }
  td { border-bottom: 1px solid var(--line); }
  pre {
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
    background: var(--code); color: #e6edf5; padding: 14px 16px; overflow: auto; margin: 0 0 16px;
  }

  .btn { background: transparent; border: 1px solid var(--ink); padding: 6px 10px; margin: 0 8px 8px 0; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn:disabled { color: var(--mute); border-color: var(--line); background: transparent; cursor: not-allowed; }
  .btn.link { border: 0; padding: 0; margin: 0; color: var(--cobalt); background: transparent; }

  .tag { display: inline-block; font-size: 12px; color: var(--mute); border: 1px solid var(--line); padding: 0 6px; margin-right: 6px; vertical-align: 1px; }
  .tag.kind { color: var(--cobalt); border-color: var(--cobalt); }
  .tag.pending { color: var(--decision); border-color: var(--decision); }
  .verb { color: var(--cobalt); }

  aside h2 { font-size: 14px; font-weight: 600; margin: 18px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .sector { margin: 0 0 14px; }
  .sector h3 { font-size: 13px; color: var(--mute); margin: 0 0 2px; font-weight: 600; }
  .conn {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 0; border-top: 1px solid var(--line);
    padding: 8px 0;
  }
  .conn:hover { background: var(--desk); }
  .conn small { display: block; color: var(--mute); }
  .conn .to { font-family: var(--serif); font-size: 16px; }

  .tray-head { display: flex; justify-content: space-between; align-items: baseline; }
  .tray-head h2 { margin: 0; }
  .sug { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .dot { width: 8px; height: 8px; margin-top: 7px; background: var(--decision); }
  .sug.is-deferred .dot { background: var(--line); }
  .sug p { margin: 0 0 8px; }
  .sug .origin { font-size: 12px; color: var(--mute); }
  .row { padding: 10px 0; border-top: 1px solid var(--line); }
  .name { font-family: var(--serif); font-size: 18px; margin: 0; }
  .cap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
  .cap button { background: transparent; border: 0; padding: 0; text-align: left; }

  .graph { width: 100%; height: auto; max-width: 760px; }
  .graph text { font-family: var(--sans); font-size: 14px; fill: var(--ink); }
  .graph .edge { font-size: 12px; fill: var(--cobalt); }
  .graph .node { cursor: pointer; }
  .graph .node:hover text { fill: var(--cobalt); }
  .graph .core { font-size: 11px; fill: var(--mute); }

  .chainflow { display: flex; align-items: stretch; flex-wrap: wrap; gap: 0; max-width: 900px; }
  .chain-node {
    border: 1px solid var(--line); padding: 10px 14px; background: transparent; text-align: left; max-width: 220px;
  }
  .chain-node.now { border-color: var(--cobalt); border-width: 2px; }
  .chain-node .nm { font-family: var(--serif); font-size: 17px; font-weight: 600; display: block; }
  .chain-node small { color: var(--mute); display: block; margin-top: 4px; }
  .chain-edge { align-self: center; padding: 0 10px; max-width: 200px; color: var(--cobalt); font-size: 13px; }
  .chain-edge .arrow { display: block; font-size: 18px; }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; max-width: 960px; }
  .split h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 8px; font-weight: 600; }
  .boundary { margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--ink); max-width: 72ch; }
  .work { max-width: 68ch; }
  textarea {
    width: 100%; min-height: 96px; background: transparent; border: 0;
    border-bottom: 1px solid var(--line); resize: vertical; line-height: 1.55; margin: 8px 0 12px;
  }
  .hint-list { list-style: none; margin: 8px 0 12px; padding: 0; }
  .hint-list li { padding: 8px 0; border-top: 1px solid var(--line); }
  fieldset { border: 0; margin: 8px 0 12px; padding: 0; }
  legend { padding: 0 0 6px; }
  .note { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--ink); max-width: 62ch; }
  .refblock {
    display: block; width: 100%; text-align: left; background: transparent;
    border: 0; border-left: 2px solid var(--cobalt); padding: 8px 12px; margin: 0 0 10px;
  }
  .refblock:hover { background: var(--desk); }
  .refblock .nm { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .refblock small { display: block; color: var(--mute); }

  .overlay { position: fixed; inset: 0; background: rgba(26, 34, 48, 0.35); z-index: 10; display: grid; place-items: start center; padding-top: 8vh; }
  .guide { background: var(--sheet); border: 1px solid var(--line); width: min(760px, 92vw); max-height: 80vh; overflow: auto; padding: 22px 26px 30px; }
  .guide h2 { font-family: var(--serif); font-size: 24px; margin: 0 0 6px; font-weight: 600; }
  .guide h3 { font-size: 15px; margin: 18px 0 4px; }
  .guide p { margin: 0 0 6px; }
  .guide ol { margin: 4px 0 10px; padding-left: 20px; }
  .kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); padding: 0 5px; }

  @media (max-width: 960px) {
    header, .app { grid-template-columns: 1fr; height: auto; }
    .app { display: block; }
    nav { display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: center; }
    .dom { margin: 0; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .split { grid-template-columns: 1fr; }
    .hero { font-size: 26px; }
    .blk .bt { display: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <button type="button" id="brand" data-act="today">Unfold</button>
    <button type="button" id="go-today" data-act="today">今日</button>
  </div>
  <p id="crumb"></p>
  <div class="head-right">
    <div class="search">
      <input id="q" type="search" placeholder="搜索点、疑问或决定　⌘K" aria-label="搜索" autocomplete="off">
      <div id="hits" class="hits" hidden></div>
    </div>
    <button type="button" class="textish" data-act="guide">导览</button>
  </div>
</header>
<div class="app">
  <nav id="outline" aria-label="领域与合集"></nav>
  <main id="main"></main>
  <aside id="rail"></aside>
</div>
<div class="overlay" id="overlay" hidden>
  <div class="guide" role="dialog" aria-label="演示导览" id="guide-box"></div>
</div>
<script>
/* ================= 数据：点 ================= */

const OBJECTS = {
  tree:      { name: "决策树",       type: "模型", domain: "算法", core: "每一条从根到叶子的路径，是一次完整决策。" },
  eq:        { name: "状态等价",     type: "概念", domain: "算法", core: "若两个历史对未来的可选决策和目标值没有区别，它们就是同一状态。" },
  memo:      { name: "记忆化搜索",   type: "方法", domain: "算法", core: "自顶向下，某个状态第一次算完就记住。" },
  bottomup:  { name: "Bottom-up",    type: "方法", domain: "算法", core: "按依赖的反方向填表，不再走递归。" },
  bt:        { name: "回溯",         type: "方法", domain: "算法", core: "保留整条路径，枚举或找到一条。" },
  dp:        { name: "动态规划",     type: "模型", domain: "算法", core: "合并对未来无区别的历史，每个状态只算一次。" },
  opt:       { name: "最优子结构",   type: "原理", domain: "算法", core: "局部最优能拼成全局最优。" },
  overlap:   { name: "重叠子问题",   type: "原理", domain: "算法", core: "同一个子问题会被反复遇到。" },
  lc131:     { name: "LC131 分割回文", type: "问题", domain: "算法", core: "把字符串分割成若干回文子串，返回所有方案。" },
  lc132:     { name: "LC132 最少分割", type: "问题", domain: "算法", core: "同样切成回文子串，只问最少分割数。" },
  lc139:     { name: "LC139 能否拆开", type: "问题", domain: "算法", core: "字符串能不能被单词表拆开，一个是或否。" },
  lc140:     { name: "LC140 全部拆法", type: "问题", domain: "算法", core: "返回所有拆法。状态落在下标 i，存的是全部方案。" },
  bag01:     { name: "0/1 背包",     type: "问题", domain: "算法", core: "每个物品至多选一次，内层容量从大到小。" },
  bagfull:   { name: "完全背包",     type: "问题", domain: "算法", core: "物品可重复选，内层容量从小到大。" },
  queue:     { name: "单调队列",     type: "方法", domain: "算法", core: "队列里只留还可能成为未来最优左端点的下标。" },
  dominance: { name: "候选支配",     type: "原理", domain: "算法", core: "只保留对未来有贡献的候选；被支配者提前淘汰。" },
  algoState: { name: "状态",         type: "概念", domain: "算法", core: "对未来决策有影响的历史摘要。可以比较，可以哈希。" },
  agentState:{ name: "状态",         type: "概念", domain: "Agent", core: "一次执行在中断之后仍能恢复的持久事实：消息、工具结果、检查点。" },
  agentLoop: { name: "Agent Loop",   type: "模型", domain: "Agent", core: "等工具结果回来，再决定下一步调用什么。" },
  deriv:     { name: "导数",         type: "概念", domain: "数学", core: "函数在某点的瞬时变化率，是差商的极限。" },
  eng:       { name: "It is not until…that…", type: "概念", domain: "英语", core: "强调「直到某时才发生某事」的句型。" }
};

/* 块文档（种子阶段为空或极少；状态等价在粘贴后生长） */
const DOCS = {
  eq: [],
  tree: [{ t: "p", text: "暴力枚举的形状。每个结点是一次选择，每条边是一个决定。它的价值是：让「重复」第一次变得可见。" }],
  memo: [{ t: "p", text: "在递归入口查表，出口写表。正确性来自：同一个状态无论被哪条路径到达，答案相同。" }],
  bottomup: [{ t: "p", text: "把依赖图画出来，按反方向填。好处是没有递归开销；代价是要自己想清楚顺序。" }],
  lc140: [
    { t: "p", text: "题面：给定 s 和 wordDict，返回 s 的全部拆法。同一单词可重复使用。界面不写算法类别。" },
    { t: "hints", items: [
      "先写暴力：从当前位置尝试每一个能匹配的单词，再处理剩下的字符串。",
      "画出递归树。同一个前缀会在不同分支里被重复展开。",
      "状态可以收成「处理到下标 i」。再往下看，这次就不能记为独立完成。",
      "把每个 i 的全部拆法存下来。自顶向下用记忆化，或自底向上填表。"
    ] }
  ],
  queue: [
    { t: "p", text: "在 LC862 里，前缀和更小、位置更靠右的下标，支配队尾那个前缀和更大的下标。新前缀和小于或等于队尾时，队尾被淘汰。" },
    { t: "p", text: "队头被淘汰是另一件事：它已经不能作为当前的左端点。" }
  ],
  agentLoop: [
    { t: "decision", text: "放弃的方案：把 Agent Loop 设计成 Workflow。Workflow 在开工前写死步骤；Loop 要等工具结果回来再决定下一步。步骤依赖观察，就不能在运行前展开成固定的图。" }
  ],
  deriv: [
    { t: "formula", text: "f′(x) = lim (Δx→0)  [ f(x+Δx) − f(x) ] / Δx" },
    { t: "theorem", title: "可导与连续", body: "可导 ⇒ 连续；连续 ⇏ 可导。反例：f(x)=|x| 在 x=0 处。" },
    { t: "p", text: "导数不是「斜率公式」，是「用极限把平均变化率收成瞬时变化率」这个想法。" }
  ],
  eng: [
    { t: "pattern", pattern: "It is not until + 时间/条件 + that + 主句", rows: [
      ["It is not until midnight that he sleeps.", "他直到半夜才睡。"],
      ["It was not until I saw the proof that I believed it.", "直到看到证明我才相信。"]
    ] },
    { t: "p", text: "易混：not...until 的强调式；倒装只发生在 until 从句提前到句首时（Not until... did he...）。" }
  ]
};

const EQ_PASTE_BLOCKS = [
  { t: "p", text: "每一条从根走到叶子的路径，是一次完整决策。路径上的信息如果不再影响后面还能做什么、以及最好能得到什么，这些路径在未来就是同一处。" },
  { t: "steps", items: [
    ["决策树", "每一条从根到叶子的路径，是一次完整决策。"],
    ["状态", "路径上对剩余决策仍有影响的那些信息。"],
    ["状态等价", "如果两个历史对未来没有影响，它们就是同一状态。"],
    ["状态合并", "等价结点并成一个，解空间变小。"],
    ["DAG", "合并之后同一个结点可以被多条路径到达，不再是树。"],
    ["Memo", "自顶向下，某个状态第一次算完就记住。"],
    ["Bottom-up", "按依赖的反方向填表，不再走递归。"]
  ] },
  { t: "table", head: ["历史", "未来", "是否等价"], rows: [
    ["选了 A，剩余容量 5", "继续选后面的物品", "是"],
    ["选了 B 再退回，剩余容量 5", "继续选后面的物品", "是"]
  ] },
  { t: "code", code: `function knapsack(items, cap) {
  const memo = new Map();
  function dfs(i, rest) {
    if (i === items.length || rest === 0) return 0;
    const key = i + "," + rest;
    if (memo.has(key)) return memo.get(key);
    let best = dfs(i + 1, rest);
    const it = items[i];
    if (it.w <= rest) {
      best = Math.max(best, it.v + dfs(i + 1, rest - it.w));
    }
    memo.set(key, best);
    return best;
  }
  return dfs(0, cap);
}` },

}
function pendingCount() { return SUGS.filter(([id]) => S.sug[id] === "pending" || S.sug[id] === "deferred").length; }
function acceptedRels() { return RELATIONS.filter((r) => r.status === "accepted"); }
function objName(id) { return OBJECTS[id] ? OBJECTS[id].name : id; }
function filedIn(id) {

function freeObjects(domain) {

}

/* 扇形：把已接受关系按方向分四个扇区 */
function sectors(id) {
  const sec = { origin: [], forward: [], contrast: [], change: [] };
  for (const r of acceptedRels()) {
    if (r.type === "evolves_from" && r.from === id) sec.origin.push({ verb: "演化自", other: r.to, note: r.note });
    else if (r.type === "prerequisite" && r.from === id) sec.origin.push({ verb: "前置", other: r.to, note: r.note });
    else if (r.type === "evolves_from" && r.to === id) sec.forward.push({ verb: "演化出", other: r.from, note: r.note });
    else if (r.type === "applies" && r.from === id) sec.forward.push({ verb: "应用于", other: r.to, note: r.note });
    else if (r.type === "applies" && r.to === id) sec.forward.push({ verb: "被用于", other: r.from, note: r.note });
    else if (r.type === "implements" && r.from === id) sec.forward.push({ verb: "实现", other: r.to, note: r.note });
    else if (r.type === "implements" && r.to === id) sec.forward.push({ verb: "被实现于", other: r.from, note: r.note });
    else if (r.type === "part_of" && r.from === id) sec.origin.push({ verb: "属于", other: r.to, note: r.note });
    else if (r.type === "contrasts" || r.type === "analogous") {
      if (r.from === id) sec.contrast.push({ verb: r.type === "contrasts" ? "对比" : "类比", other: r.to, note: r.note });
      if (r.to === id) sec.contrast.push({ verb: r.type === "contrasts" ? "对比" : "类比", other: r.from, note: r.note });
    } else if (r.type === "variant") {
      if (r.from === id) sec.change.push({ verb: "变体自", other: r.to, note: r.note });
      if (r.to === id) sec.change.push({ verb: "变体出", other: r.from, note: r.note });
    }
  }
  return sec;
}

    return `<h3 style="font-size:14px;color:var(--mute);margin:18px 0 8px">${esc(c.label)}</h3><div class="chainflow">${parts.join("")}</div>`;
  }).join("") + `<p class="muted">链不另存数据。边上的话逐字来自关系上的 what_changed。断开的链说明中间还缺一条演化关系。</p>`;

  const sec = sectors(S.focus);
  const analogyEntry = sec.contrast.find((c) => c.verb === "类比");
  return `${trayHTML()}
    <h2>扇形挖掘</h2>
    ${sectorHTML("来历 · 它从哪来", "origin", sec.origin)}
    ${sectorHTML("去向 · 它到哪去", "forward", sec.forward)}
    ${sectorHTML("对照 · 和什么容易混", "contrast", sec.contrast)}
    ${sectorHTML("变化 · 条件变了会怎样", "change", sec.change)}
    ${analogyEntry ? `<p><button type="button" class="btn link" data-act="proj" data-id="contrast">并排看这条类比（带边界）</button></p>` : ""}
    ${newLinkHTML()}
    ${capsRailHTML()}
    ${filePanelHTML()}`;
}

/* ================= 导览 ================= */
function guideHTML() {
  return `<h2>演示导览</h2>
    <p class="muted">这个原型按焦点扇形模型走 PRD 的场景：点即文档，扇形挖掘，链写条件变化，合集可选，游离合法。</p>
    <h3>场景 A · 从 GPT 长出一个点</h3>
    <ol><li>打开「状态等价」，它现在只有一句话（种子）。</li>
    <li>点「粘贴进这个点」：推导步骤、表格、代码、疑问都成块。</li>
    <li>右侧托盘 5 条连接建议，逐条接受——扇区和图当场长出来。</li></ol>

    <li>切到「链」投影，走 决策树→状态等价→记忆化搜索。</li>
    <li>走到「记忆化搜索」，右栏「发起新连接」补上 →Bottom-up，链变长。</li></ol>
    <p><button type="button" class="btn" data-act="goto" data-id="b">去场景 B</button></p>
    <h3>场景 C · 归位：编进合集</h3>
    <ol><li>在任意点的右栏「归位」面板，编进合集或新建合集。</li>
    <li>合集页里引用块是活的，上下文写在引用块之间。</li>
    <li>⌘Z 撤销。点的 ID、关系、证据全程不变。</li></ol>
    <p><button type="button" class="btn" data-act="goto" data-id="c">去场景 C</button></p>

    <ol><li>左栏「数学」或「英语」→ 游离。</li><li>导数有公式块和定理块；英语有句型块。扇形、链、能力机制完全一样。</li></ol>
    <p><button type="button" class="btn" data-act="goto" data-id="f">去场景 F</button></p>
    <h3>键盘</h3>
    <p><span class="kbd">⌘K</span> 搜索　<span class="kbd">[</span> <span class="kbd">]</span> 切换投影　<span class="kbd">1</span>–<span class="kbd">4</span> 提示　<span class="kbd">A</span> 接受建议　<span class="kbd">S</span> 延后　<span class="kbd">⌘Z</span> 撤销结构命令　<span class="kbd">Esc</span> 关闭本层</p>

/* ================= 渲染与交互 ================= */
let focusSel = "";
function render() {
  document.getElementById("crumb").textContent = crumb();
  document.getElementById("go-today").setAttribute("aria-current", S.mode === "today" ? "page" : "false");
  document.getElementById("outline").innerHTML = outlineHTML();
  document.getElementById("main").innerHTML = mainHTML();
  document.getElementById("rail").innerHTML = railHTML();
  const overlay = document.getElementById("overlay");
  if (S.guide) {
    document.getElementById("guide-box").innerHTML = guideHTML();
    overlay.hidden = false;
  } else overlay.hidden = true;
  if (focusSel) {
    const el = document.querySelector(focusSel);
    if (el) el.focus();
    focusSel = "";
  }
}

function applyFind(kind) {
  if (kind === "practice") { S.mode = "practice"; }
  else if (kind === "review") { S.mode = "review"; }
  else if (kind.startsWith("col:")) { S.mode = "collection"; S.collection = kind.slice(4); }
  else { S.mode = "focus"; S.focus = kind; S.proj = "content"; }
  document.getElementById("q").value = "";
  document.getElementById("hits").hidden = true;
  render();
}

function gotoScenario(id) {
  S.guide = false;
  if (id === "a") { S.mode = "focus"; S.focus = "eq"; S.proj = "content"; }
  if (id === "b") { S.mode = "focus"; S.focus = "eq"; S.proj = "graph"; }
  if (id === "c") { S.mode = "focus"; S.focus = "eq"; }
  if (id === "d") { S.mode = "practice"; }
  if (id === "e") { S.mode = "focus"; S.focus = "algoState"; S.proj = "contrast"; }
  if (id === "f") { S.mode = "free"; S.freeDomain = "数学"; }
  render();
}

document.body.addEventListener("click", (event) => {
  const hit = event.target.closest("[data-act='find']");
  if (hit) { applyFind(hit.dataset.id); return; }
  const el = event.target.closest("[data-act]");
  if (!el) {
    if (!event.target.closest(".search")) document.getElementById("hits").hidden = true;
    return;
  }
  const act = el.dataset.act;
  const id = el.dataset.id;
  S.toast = "";
  if (act === "today") S.mode = "today";
  else if (act === "guide") S.guide = true;
  else if (act === "guide-close") S.guide = false;
  else if (act === "goto") { gotoScenario(id); return; }
  else if (act === "focus") { S.mode = "focus"; S.focus = id; }
  else if (act === "focusc") { S.mode = "focus"; S.focus = id; S.proj = "content"; }
  else if (act === "collection") { S.mode = "collection"; S.collection = id; }
  else if (act === "free") { S.mode = "free"; S.freeDomain = id; }
  else if (act === "proj") { S.proj = id; }
  else if (act === "practice") S.mode = "practice";
  else if (act === "review") S.mode = "review";
  else if (act === "principle") S.principle = true;
  else if (act === "paste") {
    S.pasted = true;
    S.trayOpen = true;
    DOCS.eq = EQ_PASTE_BLOCKS.slice();
    S.toast = "已保存为块：推导步骤、2×3 表格、JS 代码、疑问，都在。脚本和事件属性没有进入文档。右侧托盘有 5 条连接建议。";
  }
  else if (act === "tray-close") S.trayOpen = false;
  else if (act === "tray-open") S.trayOpen = true;
  else if (act === "sug") {
    S.sug[id] = el.dataset.to;
    if (el.dataset.to === "accepted") {
      const sug = SUGS.find(([sid]) => sid === id);
      const rels = sug.slice(4).filter(Boolean);
      for (const r of rels) RELATIONS.push(r);
      if (id === "mine") DOCS.eq.splice(1, 0, { t: "mine", text: "如果两个历史对未来没有影响，它们就是同一状态。" });
      S.toast = "已接受。扇形、图、链三个投影同步更新——它们读的是同一份关系表。";
    }
  }
  else if (act === "link-demo") {
    RELATIONS.push({ from: "bottomup", to: "memo", type: "evolves_from", note: "按依赖的反方向填表，不再走递归。", status: "accepted" });
    S.undoStack.push({ kind: "link" });
    S.toast = "已连接：记忆化搜索 演化出 Bottom-up。链投影里这一段补上了。";
  }
  else if (act === "file") {
    COLLECTIONS[id].doc.push({ t: "ref", id: S.focus });
    S.coreSeen[id] = S.coreSeen[id] || S.coreVersion;
    S.undoStack.push({ kind: "file", col: id, focus: S.focus });
    S.toast = `已编入「${COLLECTIONS[id].title}」。点的 ID、关系、证据不变；移出只是删一个引用块。`;
  }
  else if (act === "file-new") {
    COLLECTIONS.compress = {
      title: "状态等价与状态空间压缩", domain: "算法", intent: "先收成同一个状态，再谈怎么存。",
      doc: [{ t: "p", text: "这个合集从「状态等价」开始长。" }, { t: "ref", id: S.focus }]
    };
    S.coreSeen.compress = S.coreVersion;
    S.undoStack.push({ kind: "file-new", focus: S.focus });
    S.toast = "已新建合集并编入。左栏出现这个合集；点的身份不变。";
  }
  else if (act === "unfile") {
    const c = COLLECTIONS[id];
    const idx = c.doc.map((b, i) => [b, i]).filter(([b]) => b.t === "ref" && b.id === S.focus).map(([, i]) => i).pop();
    if (idx !== undefined) {
      c.doc.splice(idx, 1);
      S.undoStack.push({ kind: "unfile", col: id, focus: S.focus });
      S.toast = "已移出。只是删了一个引用块，点本身没动。";
    }
  }
  else if (act === "undo") {
    const cmd = S.undoStack.pop();
    if (cmd) {
      if (cmd.kind === "link") {
        const i = RELATIONS.findIndex((r) => r.from === "bottomup" && r.to === "memo" && r.type === "evolves_from");
        if (i >= 0) RELATIONS.splice(i, 1);
      } else if (cmd.kind === "file") {
        const c = COLLECTIONS[cmd.col];
        const i = c.doc.map((b, j) => [b, j]).filter(([b]) => b.t === "ref" && b.id === cmd.focus).map(([, j]) => j).pop();
        if (i !== undefined) c.doc.splice(i, 1);
      } else if (cmd.kind === "unfile") {
        COLLECTIONS[cmd.col].doc.push({ t: "ref", id: cmd.focus });
      } else if (cmd.kind === "file-new") {
        delete COLLECTIONS.compress;
      }
      S.toast = "已撤销上一条结构命令。";
    }
  }
  else if (act === "bump-core") {
    S.coreVersion += 1;
    S.toast = `核心陈述已到 v${S.coreVersion}。编入这个点的合集里，引用块会标「核心定义已更新 · 待确认」。正文一个字没动。`;
  }
  else if (act === "core-ok") {
    S.coreSeen[S.collection] = S.coreVersion;
    S.toast = "这个合集确认已读。其他合集的待确认不受影响。";
  }
  else if (act === "hint") {
    if (S.hint < 4) S.hint += 1;
    focusSel = "#next-hint";
  }
  else if (act === "rate") {
    const attempt = document.getElementById("attempt");
    if (attempt) S.attempt = attempt.value;
    if (id === "independent" && S.hint < 3) {
      S.repeat = "independent";
      S.practiceNote = "已记下：独立完成。证据挂在「能识别重复子问题」。";
    } else if (id === "hinted") {
      S.repeat = "hinted";
      S.practiceNote = "已记下：有提示地完成。提示用到第 " + S.hint + " 级。";
    } else if (id === "fail") {
      S.repeat = "fail";
      S.repeatNote = S.obstacle || "还没有写下具体障碍";
      S.practiceNote = "已记下失败：" + S.repeatNote + "。下次复查问的是这个障碍，不是「LC140」。";
    }
  }
  else if (act === "hang-back") {
    S.hungBack = true;
    DOCS.eq.push({ t: "mine", text: "LC140 里想通的：状态落在下标 i 上，i 处要留全部拆法。" });
    S.toast = "这次理解已挂到「状态等价」的个人理解块，没有新建点。";
  }
  else if (act === "rhint") { if (S.rhint < 3) S.rhint += 1; }
  else if (act === "rrate") {
    if (id === "fail") {
      S.tail = "fail";
      S.reviewNote = "仍说不出。证据记为失败，这条能力排进下一次今日。";
    } else {
      S.tail = "recheck";
      S.reviewNote = id === "independent"
        ? "已记下：独立解释。复查日按这次表现重算（演示：约 6 天后），可提前复习。"
        : "已记下：看了提示才说出。间隔按较短一侧重算。";
    }
  }
  else if (act === "save-rewrite") {
    const box = document.getElementById("rewrite");
    if (box) S.rewrite = box.value;
    S.reviewNote = S.rewrite.trim()
      ? "这句解释已挂到「候选支配」的个人理解块。能力原句不变，没有新建点。"
      : "先写下那句解释。";
    if (S.rewrite.trim() && S.tail === "fail") S.tail = "rewritten";
  }
  render();
});

document.body.addEventListener("change", (event) => {
  if (event.target.name === "obs") {
    S.obstacle = event.target.value;
    S.repeat = "fail";
    S.repeatNote = S.obstacle;
    S.practiceNote = "已记下失败：" + S.obstacle + "。下次复查问的是这个障碍。";
    render();
  }
});

document.body.addEventListener("input", (event) => {
  if (event.target.id === "attempt") S.attempt = event.target.value;
  if (event.target.id === "rewrite") S.rewrite = event.target.value;
  if (event.target.id !== "q") return;
  const q = event.target.value.trim();
  const box = document.getElementById("hits");
  if (!q) { box.hidden = true; box.innerHTML = ""; return; }
  const found = FIND.filter((item) => item.join(" ").toLowerCase().includes(q.toLowerCase()));
  if (!found.length) {
    box.innerHTML = `<p class="muted" style="padding:8px 12px">没有这条记录</p>`;
    box.hidden = false;
    return;
  }
  const order = ["点", "能力", "决定", "疑问", "合集", "合集里的句子"];
  let html = "", lastGroup = "";
  const sorted = found.slice().sort((a, b) => order.indexOf(a[3]) - order.indexOf(b[3]));
  for (const [title, meta, kind, group] of sorted) {
    if (group !== lastGroup) { html += `<p class="group">${esc(group)}</p>`; lastGroup = group; }
    html += `<button type="button" data-act="find" data-id="${esc(kind)}"><span>${esc(title)}</span><small>${esc(meta)}</small></button>`;
  }
  box.innerHTML = html;
  box.hidden = false;
});

document.body.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    document.getElementById("q").focus();
    return;
  }
  if (event.key === "Escape") {
    if (S.guide) { S.guide = false; render(); }
    document.getElementById("hits").hidden = true;
    return;
  }
  if (event.target.matches("input, textarea")) return;
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") {
    const btn = document.querySelector("[data-act='undo']");
    if (btn) btn.click();
    return;
  }
  if (S.mode === "focus" && (event.key === "[" || event.key === "]")) {
    const order = PROJS.map(([id]) => id);
    const index = order.indexOf(S.proj);
    S.proj = order[(index + (event.key === "]" ? 1 : order.length - 1)) % order.length];
    render();
    return;
  }
  if (S.mode === "practice" && ["1", "2", "3", "4"].includes(event.key)) {
    S.hint = Number(event.key);
    render();
    return;
  }
  if (S.mode === "focus" && S.focus === "eq" && S.pasted && S.trayOpen) {
    const first = SUGS.find(([id]) => S.sug[id] === "pending");
    if (!first) return;
    if (event.key.toLowerCase() === "a") { S.sug[first[0]] = "accepted"; RELATIONS.push(...first.slice(4).filter(Boolean)); render(); }
    if (event.key.toLowerCase() === "s") { S.sug[first[0]] = "deferred"; render(); }
  }
});

render();
</script>
</body>
</html>
